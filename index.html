const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.salt),iterations:200000,hash:'SHA-256'},k0,{name:'AES-CBC',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:b(D.iv)},k,b(D.ct));
  let pages; try{ pages=JSON.parse(new TextDecoder().decode(pt)); }catch(e){ throw 0; }
  if(!pages||!pages.prispevky) throw 0;
  const p=new URLSearchParams(location.search).get('p');
  document.open();document.write(pages[p]||pages.prispevky);document.close();
}
const KEY='bv-prispevky-pw';
const getPw=()=>{let s=null;try{s=localStorage.getItem(KEY)}catch(e){} if(!s){try{s=sessionStorage.getItem(KEY)}catch(e){}} return s};
const forget=()=>{try{localStorage.removeItem(KEY)}catch(e){} try{sessionStorage.removeItem(KEY)}catch(e){}};
(async()=>{const s=getPw(); if(s){try{await open_(s);return}catch(e){forget()}}})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();
  const pw=document.getElementById('pw').value, err=document.getElementById('err');err.textContent='Ověřuji…';
  try{ try{sessionStorage.setItem(KEY,pw)}catch(e){}
    if(document.getElementById('rem').checked){try{localStorage.setItem(KEY,pw)}catch(e){}}
    await open_(pw); }
  catch(x){err.textContent='Špatné heslo.';forget()}});
</script></body></html>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.salt),iterations:200000,hash:'SHA-256'},k0,{name:'AES-CBC',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:b(D.iv)},k,b(D.ct));
  const html=new TextDecoder().decode(pt);
  if(!/<(html|title|!doctype)/i.test(html.slice(0,400))) throw 0;
  document.open();document.write(html);document.close();
}
const KEY='bv-prispevky-pw';
(async()=>{let s=null;try{s=localStorage.getItem(KEY)}catch(e){}
  if(s){try{await open_(s);return}catch(e){try{localStorage.removeItem(KEY)}catch(e){}}}})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();
